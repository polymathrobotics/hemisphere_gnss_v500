hemisphere_gnss_v500_node:
  ros__parameters:

    ip_address: "192.168.1.100"
    serial_port: 5005
    timeout_s: 5
    gps_topic: "/gps/fix"
    diagnostics_topic: "/gps/rtk/diagnostics"
    buffer_size: 8192

    baud_rate: 115200
    device_id: 1

    # --- Driver Logic / Rates ---
    publish_rate: 50.0  # Hz
    frame_id: "sensor_link"

    # --- Feature Toggles ---
    enable_raw_data: true
    calibration_mode: false

    # --- Nested Parameters (Groups) ---
    sensor_settings:
      range_max: 10.0
      range_min: 0.1
      noise_stddev: 0.05
